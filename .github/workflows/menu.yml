name: Update dining menus

on:
  schedule:
    - cron: '30 10 * * *'   # every day around 5:30 am Eastern
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  menus:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch menus
        run: python scripts/fetch_menu.py
      - name: Save the results
        if: always()
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menu
          git diff --staged --quiet || (git commit -m "Update dining menus" && git push)
